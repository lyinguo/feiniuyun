剧本结构定义 (Schema)

书名: string           # 小说名称
章节: string           # 当前章节名称或序号，例如 "第一章：雨夜"

背景设定: string       # 交代本章的故事大背景或前情提要

出场人物:              # 本章涉及到的主要人物清单
- 姓名: string
身份: string       # 例如：警察、反派、男主
性格: string       # 例如：冷静、冲动
  
场景列表:              # 按顺序排列的每一场戏
- 场景序号: integer  # 例如：1, 2, 3
发生地点: string   # 例如：南桥仓库
发生时间: string   # 例如：深夜 / 白天
场景人物: [string] # 这一场戏里具体有谁在场
  
  剧情动作: string   # 这一场戏发生了什么动作？（例如：林越一脚踹开大门，发现里面空无一人）
  
  对话:              # 具体的台词列表
  - 说话人: string # 是谁在说话
  情感: string   # 说话时的情绪/表情，例如：愤怒、冷笑、压抑
  台词: string   # 说的具体内容